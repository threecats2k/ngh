<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Alex Nguyen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
    .error-code { font-family: var(--font-display); font-size: clamp(4rem, 15vw, 8rem); font-weight: 800; color: var(--text-muted); line-height: 1; margin-bottom: 0.5rem; }
    .error-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
    .error-desc { color: var(--text-muted); max-width: 28ch; margin-bottom: 1.5rem; }
    .error-page .btn { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="/" class="logo">Alex Nguyen</a>
      <ul class="nav-links">
        <li><a href="/#work">Work</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </nav>
  </header>
  <main class="error-page">
    <p class="error-code" aria-hidden="true">404</p>
    <h1 class="error-title">Page not found</h1>
    <p class="error-desc">This page doesn’t exist or was moved. Head back to the homepage.</p>
    <a href="/" class="btn btn-primary">Back to home</a>
  </main>
  <footer class="footer">
    <p>© <span id="year"></span> Alex Nguyen. Android Developer.</p>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
